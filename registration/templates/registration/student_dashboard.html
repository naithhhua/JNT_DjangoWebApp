{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
    <h2>Student Dashboard</h2>

    <p>Total Records: <span id="student-count">0</span></p>

    <!-- Search, Filter, and Action Controls -->
    <section>
        <label for="student-search">Search name or email:</label>
        <input
            type="search"
            id="student-search"
            placeholder="Type a name or email"
        >

        <label for="program-filter">Filter by program:</label>
        <select id="program-filter">
            <option value="">All programs</option>
        </select>

        <button type="button" id="clear-filters">
            Clear Filters
        </button>

        <button type="button" id="refresh-students">
            Refresh Data
        </button>
    </section>

    <!-- Filtered Result Count -->
    <p id="result-count" aria-live="polite">Showing students</p>

    <!-- Status Messages -->
    <p id="loading-message">Loading students...</p>
    <p id="error-message" style="color: red;"></p>

    <!-- Student Table -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Program</th>
                <th>Year Level</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="student-table-body"></tbody>
    </table>

    <!-- JavaScript File -->
    <script src="{% static 'registration/js/student_dashboard.js' %}"></script>
</body>
</html>
